<svg xmlns="http://www.w3.org/2000/svg" width="520" height="340" viewBox="0 0 520 340" fill="none">
  <defs>
    <linearGradient id="concrete" x1="60" y1="50" x2="455" y2="300" gradientUnits="userSpaceOnUse"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#CBD5E1"/></linearGradient>
    <linearGradient id="lintel" x1="80" y1="60" x2="430" y2="100" gradientUnits="userSpaceOnUse"><stop stop-color="#94A3B8"/><stop offset=".5" stop-color="#E2E8F0"/><stop offset="1" stop-color="#64748B"/></linearGradient>
    <linearGradient id="shutter" x1="0" y1="120" x2="0" y2="286" gradientUnits="userSpaceOnUse"><stop stop-color="#475569"/><stop offset=".55" stop-color="#334155"/><stop offset="1" stop-color="#1E293B"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="48" gradientUnits="userSpaceOnUse"><stop stop-color="#3B82F6"/><stop offset="1" stop-color="#0847C7"/></linearGradient>
    <linearGradient id="ground" x1="50" y1="300" x2="470" y2="315" gradientUnits="userSpaceOnUse"><stop stop-color="#94A3B8" stop-opacity=".08"/><stop offset=".5" stop-color="#64748B" stop-opacity=".22"/><stop offset="1" stop-color="#94A3B8" stop-opacity=".08"/></linearGradient>
    <pattern id="slats" width="1" height="15" patternUnits="userSpaceOnUse"><rect width="1" height="12" fill="#64748B"/><path d="M0 12H520" stroke="#0F172A" stroke-opacity=".55" stroke-width="2"/><path d="M0 2H520" stroke="#CBD5E1" stroke-opacity=".16"/></pattern>
    <pattern id="hazard" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="18" fill="#FBBF24"/><rect x="9" width="9" height="18" fill="#171717"/></pattern>
    <filter id="softShadow" x="20" y="20" width="480" height="320" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="lampGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <ellipse cx="260" cy="307" rx="205" ry="17" fill="#64748B" opacity=".13" filter="url(#softShadow)"/>
  <ellipse cx="260" cy="307" rx="188" ry="13" fill="url(#ground)"/>
  <!-- side masonry / concrete frame -->
  <path d="M66 89 88 65H432L454 89V296H66V89Z" fill="url(#concrete)" stroke="#94A3B8" stroke-width="2"/>
  <path d="M66 89 88 65H432L454 89H66Z" fill="url(#lintel)"/>
  <path d="M77 95H443V292H77V95Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
  <!-- recessed door opening -->
  <rect x="111" y="111" width="298" height="183" rx="3" fill="#0F172A"/>
  <rect x="121" y="119" width="278" height="169" rx="2" fill="url(#shutter)" stroke="#0F172A" stroke-width="3"/>
  <rect x="123" y="121" width="274" height="165" fill="url(#slats)" opacity=".96"/>
  <path d="M122 128H398" stroke="#94A3B8" stroke-opacity=".42" stroke-width="2"/>
  <!-- guides and bottom rail -->
  <rect x="108" y="116" width="12" height="180" rx="2" fill="#CBD5E1" stroke="#64748B"/>
  <rect x="400" y="116" width="12" height="180" rx="2" fill="#CBD5E1" stroke="#64748B"/>
  <rect x="120" y="284" width="280" height="7" rx="2" fill="#0F172A"/>
  <!-- hazard protection at jamb bases -->
  <path d="M78 239H105V294H78V239Z" fill="url(#hazard)" stroke="#334155" stroke-width="1.5"/>
  <path d="M415 239H442V294H415V239Z" fill="url(#hazard)" stroke="#334155" stroke-width="1.5"/>
  <!-- subtle wall lights -->
  <rect x="88" y="151" width="8" height="35" rx="4" fill="#64748B"/>
  <rect x="424" y="151" width="8" height="35" rx="4" fill="#64748B"/>
  <rect x="86" y="156" width="12" height="24" rx="5" fill="#FFF7D6" filter="url(#lampGlow)"/>
  <rect x="422" y="156" width="12" height="24" rx="5" fill="#FFF7D6" filter="url(#lampGlow)"/>
  <!-- VPark blue parking fascia -->
  <rect x="73" y="77" width="374" height="48" rx="5" fill="url(#blue)" stroke="#0B45B8" stroke-width="2"/>
  <path d="M78 82H442" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" opacity=".75"/>
  <text x="260" y="111" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">P</text>
  <!-- small access keypad -->
  <rect x="429" y="203" width="13" height="27" rx="3" fill="#334155" stroke="#64748B"/>
  <circle cx="435.5" cy="210" r="2" fill="#22C55E"/>
  <path d="M434 218H437" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
</svg>
